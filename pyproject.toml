[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coderifts-sdk"
version = "3.7.0"
description = "Python SDK for CodeRifts — API governance for AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CodeRifts", email = "hello@coderifts.com" }]
keywords = ["coderifts", "api", "governance", "openapi", "agents", "mcp"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0,<3.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://coderifts.com"
Documentation = "https://coderifts.com/docs"
Repository = "https://github.com/coderifts/python-sdk"

[project.optional-dependencies]
# Measured 2026-09-06 against tests/: the only third-party import is `pytest`
# (test_canonical_request_parity.py). unittest / unittest.mock / json / os /
# pathlib / ast / inspect are stdlib. `requests` is a runtime dependency.
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["coderifts*"]
